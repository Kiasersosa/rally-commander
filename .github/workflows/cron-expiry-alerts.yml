name: Daily expiry alerts cron (manual — SMS deferred)

# Schedule disabled — SMS deferred until A2P 10DLC registration or a
# toll-free number is in place. The weekly digest already covers expiring
# items in the 1-week band, so daily SMS isn't strictly needed.
# Re-enable by adding a `schedule:` block back when SMS is wired.
on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/expiry-alerts/run
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response=$(curl -sS -X POST -w "\nHTTP %{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://rally-commander.fly.dev/api/expiry-alerts/run)
          echo "$response"
          echo "$response" | grep -q "HTTP 200" || exit 1
