name: Daily expiry alerts cron

# Re-enabled 2026-05-27 — A2P 10DLC brand + campaign submitted to TCR;
# fan-out helper sends to email always, and to SMS for users with phone
# set + sms_opt_in. The cron is harmless until any user opts in.
on:
  schedule:
    # Daily at 13:00 UTC = 8am Eastern (DST), 9am EST. Catches items
    # entering the 1-week band early in the day.
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/expiry-alerts/run
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response=$(curl -sS -X POST -w "\nHTTP %{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://rally-commander.fly.dev/api/expiry-alerts/run)
          echo "$response"
          echo "$response" | grep -q "HTTP 200" || exit 1
